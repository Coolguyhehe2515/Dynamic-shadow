name: Build Dynamic Shadows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;28.2.13676358"

      - name: Configure
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DMOD_ID=dynamic_shadows \
            -DMOD_NAME="Dynamic Shadows" \
            -DMOD_AUTHOR="KrispyBRN" \
            -DMOD_VERSION=0.1.0 \
            -DMOD_LIBRARY_NAME=dynamic_shadows

      - name: Build
        run: cmake --build build --config Release

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: DynamicShadows-arm64-v8a
          path: build/libdynamic_shadows.so
